---
name:  waffle
title: Waffle Plot
category: plots
menuGroup: Composition
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: group
      title: Variable
      type: Variable
      default: null
      suggested:
        - nominal
      permitted:
        - factor

    - name: counts
      title: Counts (optional)
      type: Variable
      default: null
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group2
      title: Grouping Variable
      type: Variable
      default: null
      suggested:
        - nominal
      permitted:
        - factor

    - name: rows
      title: Rows
      type: Number
      default: 10
      min: 2
      max: 20

    - name: percentLabels
      title: Show percentage labels
      type: Bool
      default: false

    - name: percentLabelsPosition
      title: Labels position
      type: List
      options:
        - name: legend
          title: In legend
        - name: inside
          title: Inside
        - name: outside
          title: Outside
      default: legend

    - name: title
      title: Title text
      type: String
      default: ''

    - name: titleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: center

    - name: titleFontSize
      title: Font size
      type: Number
      default: 16

    - name: titleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: subtitle
      title: Title text
      type: String
      default: ''

    - name: subtitleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: left

    - name: subtitleFontSize
      title: Font size
      type: Number
      default: 16

    - name: subtitleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: caption
      title: Title text
      type: String
      default: ''

    - name: captionAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: right

    - name: captionFontSize
      title: Font size
      type: Number
      default: 12

    - name: captionFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: titleType
      title: ""
      type: List
      options:
        - name: title
          title: Plot Title
        - name: subtitle
          title: Plot Subtitle
        - name: caption
          title: Plot Caption
      default: title

    - name: legendTitle
      title: Title text
      type: String
      default: ''

    - name: legendTitleFontSize
      title: Title font size
      type: Number
      default: 16

    - name: legendTitleFontFace
      title: Title font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: legendLabelFontSize
      title: Label font size
      type: Number
      default: 16

    - name: legendLabelFontFace
      title: Label font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: legendKeyWidth
      title: Key width
      type: Number
      default: 0.6
      min: 0

    - name: legendKeyHeight
      title: Key height
      type: Number
      default: 0.6
      min: 0

    - name: legenPositionType
      title: ""
      type: List
      options:
        - name: outside
          title: Outside
        - name: inside
          title: Inside
        - name: hide
          title: Hide
      default: outside

    - name: legendPosition
      title: Position
      type: List
      options:
        - name: top
          title: Top
        - name: right
          title: Right
        - name: bottom
          title: Bottom
        - name: left
          title: Left
      default: right

    - name: legendJustification
      title: Justification
      type: List
      options:
        - name: center
          title: Center
        - name: top
          title: Top
        - name: right
          title: Right
        - name: bottom
          title: Bottom
        - name: left
          title: Left
      default: center

    - name: legendPositionX
      title: X-position
      type: Number
      default: 0.8
      min: 0
      max: 1

    - name: legendPositionY
      title: Y-position
      type: Number
      default: 0.5
      min: 0
      max: 1

    - name: legendDirection
      title: Direction
      type: List
      options:
        - name: horizontal
          title: Horizontal
        - name: vertical
          title: Vertical
      default: vertical
...
