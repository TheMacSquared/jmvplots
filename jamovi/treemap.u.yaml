title: Treemap
name: treemap
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Size Variable (optional)
        children:
          - type: VariablesListBox
            name: size
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group2
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: General Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Labels
                children:
                  - type: CheckBox
                    name: showLabels
                    children:
                      - type: TextBox
                        name: labelFontSize
                        format: number
                        enable: (showLabels)
                      - type: CheckBox
                        name: showValues
                        enable: (showLabels)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children: []
  - type: CollapseBox
    label: Plot & Axis Titles
    collapsed: true
    stretchFactor: 1
    children:
      - type: ModeSelector
        name: titleType
        stretchFactor: 1
        children:
          - type: Content
            name: title
            children:
              - type: TextBox
                name: title
                format: string
                width: largest
              - type: TextBox
                name: titleFontSize
                format: number
              - type: ComboBox
                name: titleFontFace
              - type: ComboBox
                name: titleAlign
          - type: Content
            name: subtitle
            children:
              - type: TextBox
                name: subtitle
                format: string
                width: largest
              - type: TextBox
                name: subtitleFontSize
                format: number
              - type: ComboBox
                name: subtitleFontFace
              - type: ComboBox
                name: subtitleAlign
          - type: Content
            name: caption
            children:
              - type: TextBox
                name: caption
                format: string
                width: largest
              - type: TextBox
                name: captionFontSize
                format: number
              - type: ComboBox
                name: captionFontFace
              - type: ComboBox
                name: captionAlign
  - type: CollapseBox
    label: Legend
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Legend Title
                children:
                  - type: TextBox
                    name: legendTitle
                    format: string
                    width: large
                  - type: TextBox
                    name: legendTitleFontSize
                    format: number
                  - type: ComboBox
                    name: legendTitleFontFace
                  - type: TextBox
                    name: legendLabelFontSize
                    format: number
                  - type: ComboBox
                    name: legendLabelFontFace
              - type: Label
                label: Legend Style
                children:
                  - type: TextBox
                    name: legendKeyWidth
                    format: number
                  - type: TextBox
                    name: legendKeyHeight
                    format: number
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Legend Position
                children:
                  - type: ModeSelector
                    name: legenPositionType
                    stretchFactor: 1
                    children:
                      - type: Content
                        name: outside
                        children:
                          - type: ComboBox
                            name: legendPosition
                          - type: ComboBox
                            name: legendJustification
                      - type: Content
                        name: inside
                        children:
                          - type: TextBox
                            name: legendPositionX
                            format: number
                          - type: TextBox
                            name: legendPositionY
                            format: number
                          - type: ComboBox
                            name: legendDirection
                      - type: Content
                        name: hide
                        children: []
