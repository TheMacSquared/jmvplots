---
name:  wordcloud
title: Word Cloud
category: plots
menuGroup: Ranking
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: words
      title: Variable
      type: Variable
      default: null
      suggested:
        - nominal
      permitted:
        - factor

    - name: counts
      title: Counts (optional)
      type: Variable
      default: null
      suggested:
        - continuous
      permitted:
        - numeric

    - name: maxWords
      title: Maximum words
      type: Number
      default: 50
      min: 5
      max: 150

    - name: minFontSize
      title: Smallest font size
      type: Number
      default: 8
      min: 4
      max: 30

    - name: maxFontSize
      title: Largest font size
      type: Number
      default: 28
      min: 10
      max: 60

    - name: title
      title: Title text
      type: String
      default: ''

    - name: titleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: center

    - name: titleFontSize
      title: Font size
      type: Number
      default: 16

    - name: titleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: subtitle
      title: Title text
      type: String
      default: ''

    - name: subtitleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: left

    - name: subtitleFontSize
      title: Font size
      type: Number
      default: 16

    - name: subtitleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: caption
      title: Title text
      type: String
      default: ''

    - name: captionAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: right

    - name: captionFontSize
      title: Font size
      type: Number
      default: 12

    - name: captionFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: titleType
      title: ""
      type: List
      options:
        - name: title
          title: Plot Title
        - name: subtitle
          title: Plot Subtitle
        - name: caption
          title: Plot Caption
      default: title
...
