---
name:  lollipop
title: Lollipop Plot
category: plots
menuGroup: Ranking
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: x
      title: Variable
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      default: null

    - name: y
      title: Value Variable (optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: aggregation
      title: Summary
      type: List
      options:
        - name: mean
          title: Mean
        - name: sum
          title: Sum
        - name: median
          title: Median
      default: mean

    - name: sortBars
      title: Sort by value
      type: Bool
      default: true

    - name: lineWidth
      title: Line width
      type: Number
      default: 0.7
      min: 0.1
      max: 3

    - name: pointSize
      title: Point size
      type: Number
      default: 3
      min: 0.5
      max: 10

    - name: flipAxes
      title: Flip axes
      type: Bool
      default: false

    - name: title
      title: Title text
      type: String
      default: ''

    - name: titleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: center

    - name: titleFontSize
      title: Font size
      type: Number
      default: 16

    - name: titleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: subtitle
      title: Title text
      type: String
      default: ''

    - name: subtitleAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: left

    - name: subtitleFontSize
      title: Font size
      type: Number
      default: 16

    - name: subtitleFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: caption
      title: Title text
      type: String
      default: ''

    - name: captionAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: right

    - name: captionFontSize
      title: Font size
      type: Number
      default: 12

    - name: captionFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: xLabel
      title: Title text
      type: String
      default: ''

    - name: xLabelAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: center

    - name: xLabelFontSize
      title: Font size
      type: Number
      default: 16

    - name: xLabelFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: yLabel
      title: Title text
      type: String
      default: ''

    - name: yLabelAlign
      title: Align
      type: List
      options:
        - name: left
          title: Left
        - name: center
          title: Center
        - name: right
          title: Right
      default: center

    - name: yLabelFontSize
      title: Font size
      type: Number
      default: 16

    - name: yLabelFontFace
      title: Font face
      type: List
      options:
        - name: plain
          title: Plain
        - name: bold
          title: Bold
        - name: italic
          title: Italic
        - name: bold-italic
          title: Bold Italic
      default: plain

    - name: titleType
      title: ""
      type: List
      options:
        - name: title
          title: Plot Title
        - name: subtitle
          title: Plot Subtitle
        - name: caption
          title: Plot Caption
        - name: xTitle
          title: X-Axis Title
        - name: yTitle
          title: Y-Axis Title
      default: title

    - name: yAxisLabelFontSize
      title: Label font size
      type: Number
      default: 12

    - name: yAxisRangeType
      title: Y-Axis Range
      type: List
      options:
        - name: auto
          title: Auto
        - name: manual
          title: Manual
      default: auto

    - name: yAxisRangeMin
      title: Min
      type: Number
      default: 0

    - name: yAxisRangeMax
      title: Max
      type: Number
      default: 10

    - name: yAxisLabelRotation
      title: Label rotation
      type: Number
      default: 0
      min: 0
      max: 360

    - name: xAxisLabelFontSize
      title: Label font size
      type: Number
      default: 12

    - name: xAxisLabelFontSizeRevLabels
      title: Reverse labels
      type: Bool
      default: false

    - name: xAxisLabelRotation
      title: Label rotation
      type: Number
      default: 0
      min: 0
      max: 360
...
